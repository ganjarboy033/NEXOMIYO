name: Build APK

on:
  workflow_dispatch:          # tombol "Run workflow" manual
  push:
    branches: [main]
    paths: ["web/**", "base/**", "scripts/build-apk.sh", ".github/workflows/build-apk.yml"]
    tags: ["v*"]

permissions:
  contents: write             # perlu untuk membuat Release saat push tag v*

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Cek sintaks (frontend, backend, bundle)
        run: |
          node --check web/app.js
          node --check web/engine.js
          node --check server/server.js
          node scripts/build-bundle.js 2 "ci-check" && node --check server/public/bundle.js

      - name: Pasang build-tools ke PATH
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "Build-tools: $BT"
          echo "$BT" >> "$GITHUB_PATH"

      - name: Siapkan keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > nimiyo.jks
            echo "Memakai keystore dari secrets (APK bisa di-update menimpa versi lama)."
          else
            echo "::warning::KEYSTORE_B64 belum diset -> kunci sementara. Tiap build bertanda tangan beda, jadi harus copot-pasang."
          fi

      - name: Build + tanda tangan APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'nimiyo123' }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS || 'nimiyo' }}
        run: scripts/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nimiyo-nexora-apk
          path: dist/nimiyo-nexora.apk
          if-no-files-found: error

      - name: Rilis (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nimiyo-nexora.apk
