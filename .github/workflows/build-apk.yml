name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "base/**"
      - "scripts/build-apk.sh"
      - ".github/workflows/build-apk.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cek sintaks frontend, backend, dan bundle
        run: |
          node --check web/app.js
          node --check web/engine.js
          node --check server/server.js
          node scripts/build-bundle.js 2 "ci-check"
          node --check server/public/bundle.js

      - name: Pasang Android Build Tools ke PATH
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "Build-tools: $BT"
          echo "$BT" >> "$GITHUB_PATH"

      - name: Siapkan keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > nimiyo.jks
            echo "Memakai keystore dari secrets."
          else
            echo "::warning::KEYSTORE_B64 belum diset. APK menggunakan kunci sementara."
          fi

      - name: Build + tanda tangan APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'nimiyo123' }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS || 'nimiyo' }}
        run: bash scripts/build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nimiyo-nexora-apk
          path: dist/nimiyo-nexora.apk
          if-no-files-found: error

      - name: Buat GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nimiyo-nexora.apk